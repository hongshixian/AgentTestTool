[project]
name = "agent-test-tool"
version = "0.1.0"
description = "Pytest-based automation tests for Agent CLI products"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agentTestTool contributors" }]
dependencies = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[project.scripts]
agent-test = "agent_test_tool.cli:main"

[project.optional-dependencies]
dev = [
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent_test_tool",
    "agent_models",
    "assertions",
    "configs",
    "test_cases",
]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "assets"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["test_cases", "tests"]
pythonpath = ["."]
markers = [
    "e2e: invokes a real Agent CLI and may invoke Judge or other external services",
    "smoke: belongs to the minimal E2E verification subset",
    "security: requires trusted security-test environment evidence",
]

[tool.uv]
package = true
